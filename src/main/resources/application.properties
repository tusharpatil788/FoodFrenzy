spring.datasource.name=FoodFrenzy
spring.datasource.url=jdbc:mysql://localhost:3306/FoodFrenzy?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=cdac
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# Health endpoints used by Kubernetes probes
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info

# Finish in-flight requests during rolling updates
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Port the Helm chart expects
server.port=8080