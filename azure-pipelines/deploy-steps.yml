parameters:
  - name: namespace
    type: string
  - name: service
    type: string
  - name: imageTag
    type: string

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Helm deploy to ${{ parameters.namespace }}
    inputs:
      azureSubscription: sc-azure
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        Set-Location "$(Build.SourcesDirectory)\helm\banking-service"
        az aks command invoke -g $(rg) -n $(aks) `
          --file . `
        --command "helm upgrade --install ${{ parameters.service }} . -n ${{ parameters.namespace }} --create-namespace -f values-${{ parameters.namespace }}.yaml --set image.repository=$(acr)/${{ parameters.service }} --set image.tag=${{ parameters.imageTag }} --atomic --timeout 5m"