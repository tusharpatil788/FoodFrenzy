parameters:
  - name: namespace
    type: string
  - name: service
    type: string
  - name: imageTag
    type: string

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Helm deploy to ${{ parameters.namespace }}
    inputs:
      azureSubscription: sc-azure
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e
        az aks get-credentials -g $(rg) -n $(aks) --overwrite-existing
        helm upgrade --install ${{ parameters.service }} $(chart) \
          -n ${{ parameters.namespace }} --create-namespace \
          -f $(chart)/values-${{ parameters.namespace }}.yaml \
          --set image.repository=$(acr)/${{ parameters.service }} \
          --set image.tag=${{ parameters.imageTag }} \
          --atomic --timeout 5m
        kubectl rollout status deployment/${{ parameters.service }} -n ${{ parameters.namespace }} --timeout=120s
        helm history ${{ parameters.service }} -n ${{ parameters.namespace }}