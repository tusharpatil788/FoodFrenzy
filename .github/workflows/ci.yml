name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and unit tests
        run: mvn -B clean verify
services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: cdac
          MYSQL_DATABASE: tushar
          MYSQL_USER: Tushar Patil
          MYSQL_PASSWORD: 1998
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
image:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/foodfrenzy
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull -t $IMAGE:${{ github.sha }} .

      - name: Trivy scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            $IMAGE:${{ github.sha }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push image
        run: docker push $IMAGE:${{ github.sha }}

      - name: Trigger Azure DevOps release
        run: |
          curl --fail-with-body -sS -X POST \
            -u ":${{ secrets.AZDO_PAT }}" \
            -H "Content-Type: application/json" \
            -d '{"templateParameters":{"service":"foodfrenzy","imageTag":"${{ github.sha }}"}}' \
            "https://dev.azure.com/${{ secrets.AZDO_ORG }}/${{ secrets.AZDO_PROJECT }}/_apis/pipelines/${{ secrets.AZDO_PIPELINE_ID }}/runs?api-version=7.1"